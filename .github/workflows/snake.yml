name: Generate Contribution Snake

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'output/**'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: dwarakalokeshsadhu-bit
          outputs: dist/github-contribution-grid-snake.svg

      - name: Save animation to output folder
        run: |
          mkdir -p output
          mv dist/github-contribution-grid-snake.svg output/github-contribution-grid-snake.svg

      - name: Commit and push generated graphic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/github-contribution-grid-snake.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update contribution snake animation"
            git push origin main
          fi
